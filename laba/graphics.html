  <main>
    <section>
      <h1>SVG Графіка з анімацією</h1>
      <p>Статична композиція доповнена новими динамічними елементами згідно з вимогами.</p>

      <svg width="700" height="500" class="svg-container">
        <defs>
            <path id="textCurve" d="M 50,450 Q 350,350 650,450" stroke="none" fill="none" />
        </defs>
        
        <g fill="skyblue" stroke="navy" stroke-width="2">
            <rect x="400" y="150" width="50" height="50" />
            <rect x="450" y="100" width="50" height="50" />
            <rect x="550" y="100" width="50" height="50" />
            <rect x="600" y="150" width="50" height="50" />
            <rect x="400" y="300" width="50" height="50" />
            <rect x="600" y="300" width="50" height="50" />
            <rect x="490" y="340" width="74" height="50" />
            <circle cx="487" cy="300" r="37" />
            <circle cx="563" cy="300" r="37" />
            <ellipse cx="525" cy="200" rx="75" ry="50" />
        </g>
        
        <text font-family="Verdana" font-size="20" fill="white">
            <textPath href="#textCurve">
                Демонстрація анімації та трансформації в SVG
            </textPath>
        </text>

        <g>
            <circle cx="100" cy="100" r="40" stroke="white">
                <animate 
                    attributeName="fill"
                    values="#ff0000;#ff7f00;#ffff00;#00ff00;#0000ff;#4b0082;#ee82ee;#ff0000"
                    dur="10s"
                    repeatCount="indefinite" />
            </circle>

            <rect x="50" y="200" width="50" height="50" fill="orange" stroke="white">
                <animateMotion path="M 0,0 H 250 L 125,100 Z" dur="6s" repeatCount="indefinite" />
            </rect>

            <rect x="600" y="50" width="60" height="60" fill="purple" stroke="white">
                <animateTransform 
                    attributeName="transform"
                    type="rotate"
                    from="0 630 80" 
                    to="360 630 80"
                    dur="5s"
                    repeatCount="indefinite" />
            </rect>

            <circle cx="250" cy="100" r="15" fill="pink" stroke="white">
                <animate 
                    attributeName="r"
                    values="10;50;10"
                    dur="4s"
                    repeatCount="indefinite" />
            </circle>
        </g>
      </svg>
    </section>
  </main>
